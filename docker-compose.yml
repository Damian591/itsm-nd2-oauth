name: itsm

services:
  # HTTPS galinis taškas: TLS, HSTS, saugumo antraštės
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    networks:
      default:
        aliases: [app.itsm.test, auth.itsm.test, api.itsm.test]
    depends_on:
      - keycloak

  # Autorizacijos serveris (OAuth 2.0 / OIDC)
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kcdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://auth.itsm.test
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    depends_on:
      kcdb:
        condition: service_healthy

  # Keycloak duomenų bazė
  kcdb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - kcdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Programos serverio pusės sesijos
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  # Testinis SMTP – gaudo el. laiškus
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # Kliento programa (BFF)
  app:
    build: ./app
    restart: unless-stopped
    environment:
      # tik tai, ko programai reikia – ne visas .env (mažiausios privilegijos)
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      REDIS_URL: ${REDIS_URL}
      # kad Python pasitikėtų https://auth.itsm.test (mkcert CA), be verify=False
      SSL_CERT_FILE: /certs/rootCA.pem
      REQUESTS_CA_BUNDLE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
    depends_on:
      - redis
      - proxy

  api:
    build: ./api
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER}
      SSL_CERT_FILE: /certs/rootCA.pem
    volumes:
      - ./certs/rootCA.pem:/certs/rootCA.pem:ro
      - notes:/data
    depends_on:
      - proxy

volumes:
  kcdb: {}
  notes: {}

